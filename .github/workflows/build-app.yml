name: Build Windows app
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'RELEASE_*.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Resolve version
        id: version
        shell: pwsh
        run: ./scripts/Get-BuildVersion.ps1 -GithubOutput $env:GITHUB_OUTPUT
      - name: Test version resolution
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: ./scripts/Test-BuildVersion.ps1
      - name: Run contract tests on Windows x64
        if: matrix.runtime == 'win-x64'
        run: dotnet run --project tests/ContractTests.csproj
      - name: Run feature tests on Windows x64
        if: matrix.runtime == 'win-x64'
        run: dotnet run --project tests/FeatureTests/FeatureTests.csproj
      - name: Test English and Vietnamese resources
        if: matrix.runtime == 'win-x64'
        run: dotnet run --project tests/LocalizationTests/LocalizationTests.csproj
      - name: Test Windows UI on x64
        if: matrix.runtime == 'win-x64'
        run: dotnet run --project tests/WindowsUiTests/WindowsUiTests.csproj
      - name: Test Windows token persistence on x64
        if: matrix.runtime == 'win-x64'
        run: dotnet run --project tests/WindowsTokenTests/WindowsTokenTests.csproj
      - name: Test optional RDP password policy on Windows
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: ./scripts/Test-RdpPasswordPolicy.ps1
      - name: Build and package
        shell: pwsh
        run: ./scripts/Build-Package.ps1 -Runtime '${{ matrix.runtime }}'
      - uses: actions/upload-artifact@v4
        with:
          name: RdpLauncher-${{ matrix.runtime }}-v${{ steps.version.outputs.version }}
          path: dist/${{ matrix.runtime }}/*
          if-no-files-found: error
