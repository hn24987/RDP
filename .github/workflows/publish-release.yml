name: Publish release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/release-request']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    if: github.repository == 'hn24987/RDP-Launcher' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and validate release version
        id: version
        shell: pwsh
        run: |
          ./scripts/Get-BuildVersion.ps1 -GithubOutput $env:GITHUB_OUTPUT
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
            . ./scripts/Get-BuildVersion.ps1
            $version = (Resolve-BuildVersion -ProjectPath ./desktop/RdpLauncher/RdpLauncher.csproj).Version
            $requested = (Get-Content .github/release-request -Raw).Trim()
            if ($requested -cne $version) { throw 'Release request must match the project version.' }
          }
  build:
    name: Build ${{ matrix.runtime }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test version resolution
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: ./scripts/Test-BuildVersion.ps1
      - name: Run contract tests on Windows x64
        if: matrix.runtime == 'win-x64'
        run: dotnet run --project tests/ContractTests.csproj
      - name: Run feature tests on Windows x64
        if: matrix.runtime == 'win-x64'
        run: dotnet run --project tests/FeatureTests/FeatureTests.csproj
      - name: Test English and Vietnamese resources
        if: matrix.runtime == 'win-x64'
        run: dotnet run --project tests/LocalizationTests/LocalizationTests.csproj
      - name: Test Windows UI on x64
        if: matrix.runtime == 'win-x64'
        run: dotnet run --project tests/WindowsUiTests/WindowsUiTests.csproj
      - name: Test Windows token persistence on x64
        if: matrix.runtime == 'win-x64'
        run: dotnet run --project tests/WindowsTokenTests/WindowsTokenTests.csproj
      - name: Build and package
        shell: pwsh
        run: ./scripts/Build-Package.ps1 -Runtime '${{ matrix.runtime }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.version.outputs.version }}-${{ matrix.runtime }}
          path: dist/${{ matrix.runtime }}/*
          if-no-files-found: error
  publish:
    needs: [version, build]
    concurrency:
      group: release-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-${{ needs.version.outputs.version }}-win-*
          merge-multiple: true
          path: dist
      - name: Verify, upload to a draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat SHA256-win-*.txt > SHA256.txt
          sha256sum --check SHA256.txt
          cd ..
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish,url > release-state.json 2>/dev/null; then
            if ! jq -e '.isDraft' release-state.json > /dev/null; then
              echo 'Release is already published; existing assets will not be overwritten.'
              exit 0
            fi
            test "$(jq -r '.targetCommitish' release-state.json)" = "$GITHUB_SHA"
          else
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "RDP Launcher $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          cp RELEASE_PROMPT.md dist/RELEASE_PROMPT.md
          gh release upload "$RELEASE_TAG" dist/RdpLauncher*.exe dist/RDP-Launcher-*.zip \
            dist/SHA256.txt dist/RELEASE_PROMPT.md --clobber
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
