name: Bug report
description: Report a reproducible launcher or workflow problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Never paste GitHub tokens, Tailscale keys, RDP passwords, encrypted token files, or private files. Redact usernames, IPs and repository details from logs/screenshots when needed.
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: Include the release tag or source commit.
      placeholder: "v1.2.0"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Download architecture
      options:
        - win-x64
        - win-arm64
        - Built from source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the button or workflow step where the issue occurs.
      placeholder: "1. Open the launcher…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted error
      description: Include only the relevant error. A workflow run link is optional; ensure you are comfortable sharing it publicly.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed tokens, keys, passwords and private file contents from this report.
          required: true
        - label: I checked the setup guide and existing issues.
          required: true
