name: Capture dark UI
on:
  push:
    branches: [codex/dark-dashboard]
    paths: ['desktop/**', 'tools/UiCapture/**', '.github/workflows/capture-ui.yml']
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == 'hn24987/RDP-Launcher'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tools/UiCapture/UiCapture.csproj
      - uses: actions/upload-artifact@v4
        with:
          name: RdpLauncher-dark-UI
          path: ui-shots/*.png
      - name: Save UI images on the design branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-shots/*.png
          git commit -m 'Capture native dark UI in English and Vietnamese'
          git push origin HEAD:codex/dark-dashboard
